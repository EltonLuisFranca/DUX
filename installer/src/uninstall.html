<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Desinstalar DUX</title>
    <style>
      :root {
        --bg: #17171b;
        --bg-alt: #1e1e23;
        --text: #e4e4e7;
        --text-secondary: #9a9aa2;
        --accent: #3b82f6;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
        user-select: none;
      }

      .window-shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }

      .titlebar {
        height: 32px;
        flex-shrink: 0;
        -webkit-app-region: drag;
      }

      .shell {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 0 32px;
      }

      .logo {
        width: 56px;
        height: 56px;
      }

      .title {
        font-size: 15px;
        font-weight: 600;
      }

      .subtitle {
        margin-top: -12px;
        font-size: 12px;
        color: var(--text-secondary);
        text-align: center;
      }

      .progress-track {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: var(--bg-alt);
        border: 1px solid var(--border);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: var(--accent);
        transition: width 0.2s ease;
      }

      .status {
        font-size: 11.5px;
        color: var(--text-secondary);
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      button {
        height: 32px;
        padding: 0 18px;
        border: none;
        border-radius: 7px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }

      .btn-primary {
        background: #dc2626;
        color: #fff;
      }

      .btn-primary:hover:not(:disabled) {
        background: #b91c1c;
      }

      .btn-primary:disabled {
        background: #4b2a2a;
        color: rgba(255, 255, 255, 0.5);
        cursor: default;
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-secondary);
      }

      .btn-secondary:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }

      .btn-secondary:disabled {
        color: rgba(154, 154, 162, 0.4);
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="window-shell">
      <div class="titlebar"></div>
      <div class="shell">
        <img class="logo" src="logo.svg" />
        <div class="title">Desinstalar DUX</div>
        <div class="subtitle">Isso vai remover o DUX do seu computador.</div>

        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status" id="statusText">Pronto para desinstalar</div>

        <div class="actions">
          <button class="btn-secondary" id="cancelBtn">Cancelar</button>
          <button class="btn-primary" id="uninstallBtn">Desinstalar</button>
        </div>
      </div>
    </div>

    <script>
      const uninstallBtn = document.getElementById('uninstallBtn')
      const cancelBtn = document.getElementById('cancelBtn')
      const progressFill = document.getElementById('progressFill')
      const statusText = document.getElementById('statusText')

      const PHASE_LABELS = {
        shortcuts: 'Removendo atalhos...',
        registry: 'Removendo registro...',
        files: 'Removendo arquivos...',
        done: 'Desinstalação concluída'
      }

      uninstallBtn.addEventListener('click', async () => {
        uninstallBtn.disabled = true
        cancelBtn.disabled = true
        statusText.textContent = 'Desinstalando...'
        try {
          await window.uninstallerAPI.start()
          cancelBtn.textContent = 'Fechar'
          cancelBtn.disabled = false
        } catch (err) {
          statusText.textContent = 'Erro: ' + err.message
          cancelBtn.disabled = false
        }
      })

      window.uninstallerAPI.onProgress(({ phase, percent }) => {
        progressFill.style.width = percent + '%'
        statusText.textContent = PHASE_LABELS[phase] || statusText.textContent
      })

      cancelBtn.addEventListener('click', () => window.close())
    </script>
  </body>
</html>
