<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      .window-shell {
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #17171b;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        color: #d4d4d8;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        -webkit-app-region: drag;
        user-select: none;
        overflow: hidden;
      }
      .logo {
        width: 48px;
        height: 48px;
      }
      .label {
        font-size: 12.5px;
        color: #9a9aa2;
      }
      .bar-track {
        width: 160px;
        height: 4px;
        border-radius: 2px;
        background: #2a2a30;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        background: #3b82f6;
        transition: width 0.2s ease;
      }
    </style>
  </head>
  <body>
    <div class="window-shell">
      <img class="logo" src="../../build/icon.png" />
      <div class="label" id="label">Verificando atualizações...</div>
      <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    </div>
    <script>
      const { ipcRenderer } = require('electron')
      ipcRenderer.on('splash:status', (_event, { label, percent }) => {
        document.getElementById('label').textContent = label
        if (typeof percent === 'number') {
          document.getElementById('bar').style.width = percent + '%'
        }
      })
    </script>
  </body>
</html>
